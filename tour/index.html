  <body>
    <div id="view" aria-label="360 degree view. Drag to look around."></div>
    <div id="fade" aria-hidden="true"></div>
    <div id="hotspots" aria-hidden="false"></div>
    <header class="top">

        <button type="button" id="btn-share">Share</button>
        <button type="button" id="btn-full" title="Full screen">⛶</button>
        <a id="btn-3d" href="../" title="Open the interactive 3D walkthrough">Explore in 3D</a>
      </div>
    </nav>
    <div id="hint">Drag to look around · tap arrows to move</div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
